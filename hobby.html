<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Хоббі</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f9f9f9;
    }

    h1 {
      text-align: center;
      color: #0066cc;
      margin-top: 30px;
    }

    /* ====== ОСНОВНИЙ КОНТЕЙНЕР ====== */
    .container {
      max-width: 1200px;
      margin: auto;
      padding: 40px;
      text-align: center;
    }

    /* ====== БЛОКИ ХОБІ ====== */
    .hobbies {
      display: inline-block;
      width: 850px;
      vertical-align: top;
      text-align: left;
    }

    .hobby {
      display: inline-block;
      width: 260px;
      vertical-align: top;

      background-color: white;
      padding: 20px;
      margin: 10px;

      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);

      box-sizing: border-box;
    }

    .hobby h3 {
      margin-top: 0;
      color: #0066cc;
    }

    /* ====== SIDEBAR ====== */
    .sidebar {
      display: inline-block;
      width: 250px;
      vertical-align: top;
      margin-left: 20px;
    }

    .ad {
      background-color: #ffeb99;
      padding: 20px;
      text-align: center;
      border-radius: 8px;
      font-weight: bold;
    }

  </style>
</head>

<body>

  <h1>Заголовок сторінки (Хоббі)</h1>

  <div class="container">

    <!-- ХОБІ -->
    <div class="hobbies">

      <div class="hobby">
        <h3>Хоббі 1</h3>
        <p>Спорт, музика чи малювання.</p>
      </div>

      <div class="hobby">
        <h3>Хоббі 2</h3>
        <p>Програмування, подорожі чи фотографія.</p>
      </div>

      <div class="hobby">
        <h3>Хоббі 3</h3>
        <p>Кулінарія, читання чи волонтерство.</p>
      </div>

    </div>

    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="ad">Рекламний блок</div>
    </div>

  </div>

</body>
</html>
